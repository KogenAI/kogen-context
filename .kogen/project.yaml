version: 1
commands:
  setup: []
  fix:
    - cargo fmt --all
  checks:
    - {name: format, run: 'cargo fmt --all --check'}
    - {name: clippy, run: 'cargo clippy --locked --offline --all-targets -- -D warnings'}
    - {name: test, run: 'cargo test --locked --offline'}
    - {name: build, run: 'cargo build --locked --offline'}
  acceptance:
    run: 'NODE_PATH="$KOGEN_CUCUMBER" "$KOGEN_NODE" "$KOGEN_CUCUMBER/@cucumber/cucumber/bin/cucumber.js" --strict --require ''features/steps/*.js'' --format "message:$KOGEN_ACCEPTANCE_REPORT" "$KOGEN_ACCEPTANCE_FEATURES"'
    steps_dir: features/steps
protect:
  - rust-toolchain.toml
